spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  application:
    name: ${APP_NAME:enjoyshop-service-goods}
  profiles:
    default: dev
  config:
    import:
      - classpath:egon-mybatis-plus-sharding.yml
      - optional:file:./config/application-secrets.yml
      - optional:configtree:/run/secrets/
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  task:
    execution:
      thread-name-prefix: ${ASYNC_THREAD_NAME_PREFIX:egon-async-}
      shutdown:
        await-termination: true
        await-termination-period: ${ASYNC_AWAIT_TERMINATION:30s}
      pool:
        core-size: ${ASYNC_CORE_SIZE:8}
        max-size: ${ASYNC_MAX_SIZE:32}
        queue-capacity: ${ASYNC_QUEUE_CAPACITY:500}
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: ${SCHEDULING_AWAIT_TERMINATION:30s}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: ${APP_TIME_ZONE:Asia/Shanghai}
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:200}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:20}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:20s}
    keep-alive-timeout: ${TOMCAT_KEEP_ALIVE_TIMEOUT:20s}
    max-keep-alive-requests: ${TOMCAT_MAX_KEEP_ALIVE_REQUESTS:100}
    max-http-form-post-size: ${TOMCAT_MAX_HTTP_FORM_POST_SIZE:2MB}
    max-swallow-size: ${TOMCAT_MAX_SWALLOW_SIZE:2MB}
    processor-cache: ${TOMCAT_PROCESSOR_CACHE:200}
    mbeanregistry:
      enabled: ${TOMCAT_MBEAN_REGISTRY_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true


logging:
  file:
    path: ${LOG_HOME:./logs}
  group:
    web-stack: org.springframework.web,org.springframework.http,org.apache.catalina,org.apache.coyote
    persistence: org.mybatis,org.mybatis.spring,com.baomidou.mybatisplus,org.springframework.jdbc,org.hibernate.SQL
    rpc: top.egon.cola.component.rpc,io.grpc
    messaging: org.springframework.kafka,org.springframework.amqp
  level:
    root: info
    web-stack: info
    persistence: warn
    rpc: info
    messaging: info
    top.egon.enjoyshop: info
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:100MB}
      max-history: ${LOG_MAX_HISTORY:30}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:10GB}
      clean-history-on-start: ${LOG_CLEAN_HISTORY_ON_START:false}

app:
  search:
    enabled: false
    public-sites: {}
    query-timeout: PT2S
  cdc:
    enabled: false
    max-payload-bytes: 1048576
    confirm-timeout: PT5S
    source-registry: {}
  logging:
    instance-name: ${INSTANCE_ID:${HOSTNAME:local}}
    error-total-size-cap: ${LOG_ERROR_TOTAL_SIZE_CAP:2GB}
    async:
      queue-size: ${LOG_ASYNC_QUEUE_SIZE:8192}
      discarding-threshold: ${LOG_ASYNC_DISCARDING_THRESHOLD:0}
      never-block: ${LOG_ASYNC_NEVER_BLOCK:false}
      max-flush-time: ${LOG_ASYNC_MAX_FLUSH_TIME:5000}
  ad:
    public-enabled: false
    public-sites: {}
    allowed-positions:
      - web_index_lb
    candidate-limit: 200
    public-limit: 20
    load-timeout: PT2S
  integrations:
    rabbitmq:
      enabled: false
      exchange: ${spring.application.name}.domain
    redis:
      enabled: false
      ttl: 10m
    external-http:
      enabled: false
  web:
    cors:
      allowed-origins: ${GOODS_CORS_ALLOWED_ORIGINS:}
  object-storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT:}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    bucket: ${OBJECT_STORAGE_BUCKET:product-media}
    path-style-access: ${OBJECT_STORAGE_PATH_STYLE_ACCESS:true}
    public-url-base: ${OBJECT_STORAGE_PUBLIC_URL_BASE:}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
    api-call-attempt-timeout: 15s
    api-call-timeout: 20s

mybatis-plus:
  mapper-locations: classpath*:/mybatis/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

egon:
  cola:
    component:
      cache:
        enabled: true
        node-id: ""
        key-prefix: egon:cola:cache:v2:${spring.application.name}
        tenant-mdc-key: tenantId
        second-evict-delay: PT5S
        redis:
          topic: "egon:cola:cache:event"
        l1:
          max-size: 10000
        ttl:
          l1-expire: PT5M
          l1-jitter: PT2M
          l2-expire: PT1H
          l2-jitter: PT20M
          null-expire: PT60S
        regions:
          AdCandidates:
            l1-expire: PT10S
            l1-jitter: PT2S
            l2-expire: PT30S
            l2-jitter: PT5S
        batch:
          max-keys: 1000
        lock:
          wait-time: PT0.5S
          lease-time: PT10S
      mybatis-plus:
        lifecycle:
          restore-statements:
            - top.egon.enjoyshop.goods.infrastructure.goods.dao.SpuDAO.restoreVersionedById
            - top.egon.enjoyshop.goods.infrastructure.goods.dao.SkuDAO.restoreVersionedById
          statement-policies:
            "[top.egon.enjoyshop.goods.infrastructure.goods.dao.SpuDAO.selectByLifecycle]":
              scope: ID
              table: spu
            "[top.egon.enjoyshop.goods.infrastructure.goods.dao.SpuDAO.lockByLifecycle]":
              scope: ID
              table: spu
            "[top.egon.enjoyshop.goods.infrastructure.goods.dao.SpuDAO.selectPage]":
              scope: PAGE
              table: spu
            "[top.egon.enjoyshop.goods.infrastructure.goods.dao.SpuDAO.countPage]":
              scope: COUNT
              table: spu
            "[top.egon.enjoyshop.goods.infrastructure.ad.dao.AdDAO.selectByLifecycle]":
              scope: ID
              table: ad
            "[top.egon.enjoyshop.goods.infrastructure.ad.dao.AdDAO.lockByLifecycle]":
              scope: ID
              table: ad
            "[top.egon.enjoyshop.goods.infrastructure.ad.dao.AdDAO.selectPage]":
              scope: PAGE
              table: ad
            "[top.egon.enjoyshop.goods.infrastructure.ad.dao.AdDAO.countPage]":
              scope: COUNT
              table: ad
            "[top.egon.enjoyshop.goods.infrastructure.ad.dao.AdDAO.selectCandidates]":
              scope: PAGE
              table: ad
            "[top.egon.enjoyshop.goods.infrastructure.ad.dao.AdDAO.deleteVersionedById]":
              scope: MONOTONE_DELETE
              table: ad
            "[top.egon.enjoyshop.goods.infrastructure.goods.dao.SpuDAO.purgeDeletedById]":
              scope: PURGE_ID
              table: spu
            "[top.egon.enjoyshop.goods.infrastructure.goods.dao.SpuDAO.deleteVersionedById]":
              scope: MONOTONE_DELETE
              table: spu
            "[top.egon.enjoyshop.goods.infrastructure.goods.dao.SpuDAO.restoreVersionedById]":
              scope: RESTORE
              table: spu
            "[top.egon.enjoyshop.goods.infrastructure.goods.dao.SkuDAO.selectBySpuLifecycle]":
              scope: PARENT
              table: sku
              key-column: spu_id
            "[top.egon.enjoyshop.goods.infrastructure.goods.dao.SkuDAO.selectAllBySpuForPurge]":
              scope: ALL_PARENT
              table: sku
              key-column: spu_id
            "[top.egon.enjoyshop.goods.infrastructure.goods.dao.SkuDAO.purgeAllBySpu]":
              scope: PURGE_PARENT
              table: sku
              key-column: spu_id
              parent-table: spu
            "[top.egon.enjoyshop.goods.infrastructure.goods.dao.SkuDAO.deleteVersionedById]":
              scope: MONOTONE_DELETE
              table: sku
            "[top.egon.enjoyshop.goods.infrastructure.goods.dao.SkuDAO.restoreVersionedById]":
              scope: RESTORE
              table: sku
              restore-null-columns: [deletion_kind]
        enabled: true
        tenant-id:
          mdc-key: tenantId
          ignored-tables: []
        audit:
          user-id-mdc-key: userId
        pagination:
          enabled: true
          max-page-size: 500
          overflow: false
        batch:
          default-size: 1000
          max-chunk-size: 1000
          max-collection-size: 10000
        block-attack:
          enabled: true
        optimistic-locker:
          enabled: true
        dynamic-table-name:
          enabled: false
          tables: {}
        illegal-sql:
          enabled: false
        ddl:
          enabled: true
          lock-timeout: PT30S
          statement-timeout: PT300S
          topology-ready-timeout: PT60S
        local-write-guard:
          enabled: true
          allowed-root-statements:
            "[top.egon.enjoyshop.goods.infrastructure.goods.dao.SpuDAO.purgeDeletedById]": id
            "[top.egon.enjoyshop.goods.infrastructure.goods.dao.SkuDAO.purgeAllBySpu]": spu_id
        sharding:
          enabled: true
          mode: ${APP_DATASOURCE_MODE:SHARDING_READWRITE}
          config-style: NATIVE
          native-rules-resource: classpath:egon-ss-readwrite.yml
          transaction-default-type: LOCAL
          data-sources:
            - name: master_data_primary
              logical-name: master_data
              role: PRIMARY
              driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${LIGHT_SHARDING_MASTER_DATA_URL}
              username: ${LIGHT_SHARDING_USERNAME}
              password: "${LIGHT_SHARDING_PASSWORD:}"
            - name: master_data_replica_0
              logical-name: master_data
              role: REPLICA
              driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${LIGHT_SHARDING_MASTER_DATA_REPLICA_0_URL}
              username: ${LIGHT_SHARDING_MASTER_DATA_REPLICA_0_USERNAME}
              password: "${LIGHT_SHARDING_MASTER_DATA_REPLICA_0_PASSWORD:}"
            - name: shard_0_primary
              logical-name: shard_0
              role: PRIMARY
              driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${LIGHT_SHARDING_SHARD_0_URL}
              username: ${LIGHT_SHARDING_USERNAME}
              password: "${LIGHT_SHARDING_PASSWORD:}"
            - name: shard_0_replica_0
              logical-name: shard_0
              role: REPLICA
              driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${LIGHT_SHARDING_SHARD_0_REPLICA_0_URL}
              username: ${LIGHT_SHARDING_SHARD_0_REPLICA_0_USERNAME}
              password: "${LIGHT_SHARDING_SHARD_0_REPLICA_0_PASSWORD:}"
            - name: shard_1_primary
              logical-name: shard_1
              role: PRIMARY
              driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${LIGHT_SHARDING_SHARD_1_URL}
              username: ${LIGHT_SHARDING_USERNAME}
              password: "${LIGHT_SHARDING_PASSWORD:}"
            - name: shard_1_replica_0
              logical-name: shard_1
              role: REPLICA
              driver-class-name: ${LIGHT_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${LIGHT_SHARDING_SHARD_1_REPLICA_0_URL}
              username: ${LIGHT_SHARDING_SHARD_1_REPLICA_0_USERNAME}
              password: "${LIGHT_SHARDING_SHARD_1_REPLICA_0_PASSWORD:}"
      id:
        enabled: true
        machine-id: ${EGON_ID_MACHINE_ID}
        max-clock-backward: PT0.005S
      rpc:
        enabled: false
        identity:
          env: ${APP_ENV:dev}
          host: ${RPC_ADVERTISED_HOST:localhost}
          instance-id: ${INSTANCE_ID:${HOSTNAME:local}}
        provider:
          enabled: false
          port: ${RPC_PORT:50051}
          advertised-host: ${RPC_ADVERTISED_HOST:localhost}
          registration-fail-fast: true
        consumer:
          enabled: false
          default-timeout-ms: 3000
          max-retries: 0
        tls:
          enabled: ${RPC_TLS_ENABLED:false}
          development-plaintext: ${RPC_DEVELOPMENT_PLAINTEXT:true}
          certificate-chain-path: ${RPC_CERTIFICATE_CHAIN_PATH:}
          private-key-path: ${RPC_PRIVATE_KEY_PATH:}
          trust-certificate-collection-path: ${RPC_TRUST_CERTIFICATE_COLLECTION_PATH:}
      tianshu:
        enabled: false
        biz-code: ${TIANSHU_BIZ_CODE:student-management}
        app-code: ${TIANSHU_APP_CODE:${spring.application.name}}
        env: ${APP_ENV:dev}
        namespace: ${TIANSHU_NAMESPACE:default}
        registration-resource-uri: ${TIANSHU_REGISTRATION_RESOURCE_URI:}
        redis:
          enabled: false
          host: ${TIANSHU_REDIS_HOST:localhost}
          port: ${TIANSHU_REDIS_PORT:6379}
          password: ${TIANSHU_REDIS_PASSWORD:}
          database: ${TIANSHU_REDIS_DATABASE:0}
        consistency:
          fail-fast: true
        registry:
          enabled: false
          http:
            enabled: false
            env: ${APP_ENV:dev}
            namespace: ${TIANSHU_NAMESPACE:default}
            instance-id: ${INSTANCE_ID:${HOSTNAME:local}}
            service-name: ${spring.application.name}
            version: 1.0.0
            advertised-host: ${HTTP_ADVERTISED_HOST:localhost}
            port: ${server.port:8080}
            fail-fast: true
        rpc:
          target: ${TIANSHU_RPC_TARGET:}
          tls:
            enabled: ${TIANSHU_RPC_TLS_ENABLED:false}
            development-plaintext: ${TIANSHU_RPC_DEVELOPMENT_PLAINTEXT:true}
            certificate-chain-path: ${TIANSHU_RPC_CERTIFICATE_CHAIN_PATH:}
            private-key-path: ${TIANSHU_RPC_PRIVATE_KEY_PATH:}
            trust-certificate-collection-path: ${TIANSHU_RPC_TRUST_CERTIFICATE_COLLECTION_PATH:}
          auth:
            enabled: ${TIANSHU_RPC_AUTH_ENABLED:true}
            runtime:
              access-key: ${TIANSHU_RUNTIME_ACCESS_KEY:}
              secret-key: ${TIANSHU_RUNTIME_SECRET_KEY:}
            registry:
              access-key: ${TIANSHU_REGISTRY_ACCESS_KEY:}
              secret-key: ${TIANSHU_REGISTRY_SECRET_KEY:}
      yuheng:
        openapi:
          enabled: ${OPENAPI_GOVERNANCE_ENABLED:false}
          publish-to-tianshu: ${OPENAPI_PUBLISH_TO_TIANSHU:false}
    platform:
      tianquan:
        jianshen:
          enabled: true
          register-filter: false
          system-code: enjoyshop-goods
          runtime:
            redis-enabled: true
            redis-address: ${JIANSHEN_REDIS_ADDRESS:redis://127.0.0.1:6379}
            database: ${JIANSHEN_REDIS_DATABASE:0}
            password-file: ${JIANSHEN_REDIS_PASSWORD_FILE:}
            timeout: PT2S
          authorization:
            endpoint: ${JIANSHEN_AUTHORIZATION_ENDPOINT:http://127.0.0.1:8082}
            cache-ttl: PT1S
            maximum-jitter: PT0S
            near-cache-ttl: PT0S
            fetch-timeout: PT1S
            service-token:
              enabled: true
              resource-uri: ${JIANSHEN_RESOURCE_URI:rbac3://authorization}
              scopes: rbac3.snapshot.read
        shoubing:
          enabled: ${TIANQUAN_SHOUBING_ENABLED:false}
          register-filter: false
          issuer: ${TIANQUAN_SHOUBING_ISSUER:}
          jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI:}
          resource-server-id: ${TIANQUAN_SHOUBING_RESOURCE_SERVER_ID:}
          resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
          service-client:
            app-id: ${TIANQUAN_SHOUBING_SERVICE_APP_ID:}
            registration-id: tianshuregistration
